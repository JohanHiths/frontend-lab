<div class="recipe-content">

    <section class="ingredients">
        <h2>Ingredienser</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">ca 1200 g lax i bit med skinn</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">3 msk salt</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">3 msk farinsocker</span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">4 dl rökflis</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">35 briketter</span>
        </label>
    </section>


    
      <section class="ingredients">
        <h2>Gör så här</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text"> Lägg laxen på skinnsidan i en form eller på ett fat. Strö ett jämnt lager salt och sedan socker över laxen. Täck över med plastfolie och rimma i 10 timmar i kylskåpet.</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text"> Ta ut laxen ur kylskåpet och skölj bort salt och socker under rinnande kallt vatten. Torka laxen försiktigt med hushållspapper och låt den torka i kylen utan plast i ca 2 timmar.</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Blötlägg rökflisen och låt dra i 10 minuter. Tänd grillen med briketterna.</span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Skär laxen i 2 bitar, så att den får plats på grillen. Lägg laxen på bakplåtspapper och lägg gärna på en grillbricka eller grillplanka. Det går också bra att lägga den på ett dubbelvikt bakplåtspapper direkt på gallret.</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text"> Häll ut briketterna i en hög på grillens ena sida (vi har använt en 58 cm klotgrill). Låt rökflisen rinna av något och lägg på hälften på briketterna. Lägg laxen på den sida av grillen som inte har briketter under sig. Sätt på locket och rök laxen på ca 150°C i först 10 minuter. Använd spjällen för att kontrollera värmen.</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text"> Lägg därefter på resten av rökflisen och rök ytterligare ca 10 minuter eller tills laxen har en innertemperatur på 54°C.</span>
        </label>
         <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text"> Låt laxen svalna och för bästa smak stå i kylen i ca 8 timmar.</span>
        </label>
         <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">  Här finns tips på goda såser att servera till lax.</span>
        </label>
    </section>
