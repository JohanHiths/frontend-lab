   <div class="widget-container">

        <h1 class="widget-h1">Pasta</h1>

        <div class="widget-info">
            <div class="widget-emoji">🍳 1 stycken</div>

</div>

<div class="recipe-content">

    <section class="ingredients">
        <h2>Ingredienser</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1 gul lök</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">2 vitlöksklyftor</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">2 morötter</span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">500 g nötfärs eller hushållsfärs (ärt- och nötfärs)</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">2 msk matolja</span>
        </label>
          <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1/2 dl tomatpuré</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1/2 dl tomatpuré</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">500 g krossade tomater</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">2 1/2 dl vatten</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1 kycklingbuljongtärning</span>
        </label>
         <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1 tsk kinesisk soja</span>
        </label>
         <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">salt</span>
        </label>
         <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">svartpeppar</span>
        </label>
         <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">4 portioner spaghetti</span>
        </label>
    </section>


    
      <section class="ingredients">
        <h2>Gör så här</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Skala och hacka lök och vitlök. Skala och riv morötterna grovt på ett rivjärn.</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Bryn köttfärsen och grönsakerna i oljan i en stor stekpanna eller gryta, tillsätt tomatpuré och bryn med den ett tag.</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Tillsätt krossade tomater, vatten, smulad buljongtärning och soja. Koka sakta 15 minuter, smaka av med salt och peppar.</span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text"> Koka spaghettin enligt anvisningen på förpackningen.</span>
        </label>
    
    </section>
