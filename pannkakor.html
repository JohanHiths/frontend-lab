<body>

   <div class="widget-container">

    <div class="widget-left">
        <img
            src="bilder/pannkaka-ny.jpg"
            alt="Chokladbollar"
            class="widget-image"
        >
    </div>

    <div class="widget-right">

        <h1 class="widget-h1">Pannkakor</h1>

        <div class="widget-info">
            <div class="widget-emoji">🍳 6 stycken</div>
            <div class="widget-emoji">⏳ 30 min</div>
            <div class="widget-emoji">🎂 Bak och dessert</div>
        </div>

        <p class="widget-description">
            Pannkakor är gött!
        </p>

    </div>

</div>

<div class="recipe-content">

    <section class="ingredients">
        <h2>Ingredienser</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1 msk smör</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">2 dl socker</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">3 msk kakao</span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1½ tsk vaniljsocker</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">2 msk starkt kaffe, typ espresso</span>
        </label>
    </section>


    
      <section class="ingredients">
        <h2>Gör så här</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Rör smör, socker, kakao och vaniljsocker poröst. Gärna med en elvisp eller köksassistent. </span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Tillsätt resterande ingredienser och arbeta ihop till en jämn smet med händerna.</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Låt smeten stå i 15 minuter så den sväller lite. </span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Rulla bollar av smeten och rulla sedan dessa i pärlsocker eller kokosflingor. </span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Ställ i kyl för att stelna, men låt gärna rumstempereras innan servering. </span>
        </label>
    </section>

</div>

</body>
