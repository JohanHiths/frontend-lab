<body>

   <div class="widget-container">

    <div class="widget-left">
        <img
            src="bilder/pannkaka-ny.jpg"
            alt="Chokladbollar"
            class="widget-image"
        >
    </div>

    <div class="widget-right">

        <h1 class="widget-h1">Pannkakor</h1>

        <div class="widget-info">
            <div class="widget-emoji">🍳 6 stycken</div>
            <div class="widget-emoji">⏳ 30 min</div>
            <div class="widget-emoji">🎂 Bak och dessert</div>
        </div>

        <p class="widget-description">
            Pannkakor är gött!
        </p>

    </div>

</div>

<div class="recipe-content">

    <section class="ingredients">
        <h2>Ingredienser</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">2 1/2 dl vetemjöl</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">1/2 tsk salt</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">6 dl mjölk</span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">3 ägg</span>
        </label>
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">smör (till stekning)</span>
        </label>
          <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">sylt, bär eller frukt till servering</span>
        </label>
    </section>


    
      <section class="ingredients">
        <h2>Gör så här</h2>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">En sats på 4 portioner blir 8-10 pannkakor beroende på storleken på stekpannan. </span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Blanda mjöl och salt i en bunke. Vispa i hälften av mjölken och vispa till en slät smet. Vispa i resten av mjölken och äggen. Låt smeten vila ca 10 minuter.</span>
        </label>

        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Stek tunna pannkakor i lite smör, för varje pannkaka, i en stek- eller pannkakspanna. </span>
        </label>
        
        <label class="ingredient">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="ingredient-text">Servera med sylt och grädde, bär eller frukt.</span>
        </label>
    
    </section>

</div>

</body>
</html>
